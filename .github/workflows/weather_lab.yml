name: Weather lab (should the spread model use the forecast?)

# Manual trigger only. Tests whether the spread model is better with or
# without its weather inputs (temperature, wind, rain, indoors), walk-forward
# on 2024, 2025 and 2026 so far, and how far the forecast alone moves its
# numbers. Does NOT touch the live model, the dashboard or the Bet Card.
# Saves docs/data/weather_lab.json.
#
# 2026 data is pulled fresh for this run only (about 20 CFBD calls) and is
# never saved to the shared data cache, so the daily model run is unaffected.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CFBD_API_KEY: ${{ secrets.CFBDATA_API_KEY }}
      ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      ODDSPAPI_API_KEY: ${{ secrets.PRIZEPICKS_API }}
      YEARS: "2022 2023 2024 2025"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Restore only -- this run never saves a cache.
      - name: Restore cached historical CFBD data
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: cfbd-raw-${{ env.YEARS }}-${{ github.run_id }}
          restore-keys: |
            cfbd-raw-${{ env.YEARS }}-
            cfbd-raw-

      - name: Fetch historical data (2022-2025, cached)
        run: python scripts/fetch_historical_data.py --years ${{ env.YEARS }}

      - name: Fetch 2026 so far (best effort)
        run: |
          rm -f data/raw/*_2026.csv
          python scripts/fetch_historical_data.py --years 2026 || echo "::warning::2026 fetch failed -- grading 2024-2025 only"

      - name: Build features
        run: |
          Y="${{ env.YEARS }}"
          if [ -f data/raw/games_2026.csv ] && [ -f data/raw/lines_2026.csv ]; then Y="$Y 2026"; fi
          echo "Building features for: $Y"
          python scripts/build_features.py --years $Y
          echo "LAB_YEARS=$Y" >> "$GITHUB_ENV"

      - name: Run the weather lab
        run: python scripts/weather_lab.py --years $LAB_YEARS

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/weather_lab.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Weather lab results [skip ci]"
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git merge -X ours --no-edit origin/main -m "Merge origin/main [skip ci]" && git push origin main; then
              echo "Pushed on attempt $i"; break
            fi
            [ "$i" -eq 5 ] && echo "::error::Could not push results" && exit 1
            sleep $((RANDOM % 10 + 5))
          done
