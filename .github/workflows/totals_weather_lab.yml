name: Totals + props weather lab

# Manual trigger (and runs when this file is pushed, so a session that can
# push but can't press "Run workflow" can start it). Two read-only tests,
# 11/2026:
#   scripts/totals_lab.py         is there a profitable game totals model?
#   scripts/props_weather_lab.py  do wind/rain/cold change the official props?
# Does NOT touch the live model, the dashboard or the Bet Card. Saves
# docs/data/totals_lab.json, totals_lab_detail.csv, props_weather_lab.json.
#
# Past seasons' lines are re-pulled once (one CFBD call a season) to pick up
# opening totals; 2026 is pulled fresh for this run only, never cached.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/totals_weather_lab.yml"

permissions:
  contents: write

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CFBD_API_KEY: ${{ secrets.CFBDATA_API_KEY }}
      YEARS: "2022 2023 2024 2025"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore cached historical CFBD data
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: cfbd-raw-${{ env.YEARS }}-${{ github.run_id }}
          restore-keys: |
            cfbd-raw-${{ env.YEARS }}-
            cfbd-raw-

      - name: Fetch historical data (2022-2025, cached)
        run: python scripts/fetch_historical_data.py --years ${{ env.YEARS }}

      - name: Fetch 2026 so far (best effort)
        run: |
          rm -f data/raw/*_2026.csv
          python scripts/fetch_historical_data.py --years 2026 || echo "::warning::2026 fetch failed -- grading through 2025 only"

      - name: Build features
        run: |
          Y="${{ env.YEARS }}"
          if [ -f data/raw/games_2026.csv ] && [ -f data/raw/lines_2026.csv ]; then Y="$Y 2026"; fi
          echo "Building features for: $Y"
          python scripts/build_features.py --years $Y
          echo "LAB_YEARS=$Y" >> "$GITHUB_ENV"

      - name: Run the totals lab
        run: python scripts/totals_lab.py --years $LAB_YEARS

      - name: Run the props weather lab
        run: python scripts/props_weather_lab.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/totals_lab.json docs/data/totals_lab_detail.csv docs/data/props_weather_lab.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Totals + props weather lab results [skip ci]"
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git merge -X ours --no-edit origin/main -m "Merge origin/main [skip ci]" && git push origin main; then
              echo "Pushed on attempt $i"; break
            fi
            [ "$i" -eq 5 ] && echo "::error::Could not push results" && exit 1
            sleep $((RANDOM % 10 + 5))
          done
