name: Move lab (does the direction a line moves after a flag matter?)

# Flags spread plays against the opener (walk-forward, 2024-26), then splits
# them by which way the line moved by the close (toward the model's side,
# none, away) and grades each at the open, at the close, and faded at the
# close, for every flagged play and the Bet Card.
# Does NOT touch the live model, the dashboard or the Bet Card. Saves
# docs/data/move_lab.json and docs/data/move_lab_detail.csv.
# Runs on demand, or when this file changes on main.
#
# 2026 data is pulled fresh for this run only (about 20 CFBD calls) and is
# never saved to the shared data cache, so the daily model run is unaffected.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/move_lab.yml"

permissions:
  contents: write

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CFBD_API_KEY: ${{ secrets.CFBDATA_API_KEY }}
      ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      ODDSPAPI_API_KEY: ${{ secrets.PRIZEPICKS_API }}
      YEARS: "2022 2023 2024 2025"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Restore only -- this run never saves a cache.
      - name: Restore cached historical CFBD data
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: cfbd-raw-${{ env.YEARS }}-${{ github.run_id }}
          restore-keys: |
            cfbd-raw-${{ env.YEARS }}-
            cfbd-raw-

      - name: Fetch historical data (2022-2025, cached)
        run: python scripts/fetch_historical_data.py --years ${{ env.YEARS }}

      - name: Fetch 2026 so far (best effort)
        run: |
          rm -f data/raw/*_2026.csv
          python scripts/fetch_historical_data.py --years 2026 || echo "::warning::2026 fetch failed -- grading 2024-2025 only"

      - name: Build features
        run: |
          Y="${{ env.YEARS }}"
          if [ -f data/raw/games_2026.csv ] && [ -f data/raw/lines_2026.csv ]; then Y="$Y 2026"; fi
          echo "Building features for: $Y"
          python scripts/build_features.py --years $Y
          echo "LAB_YEARS=$Y" >> "$GITHUB_ENV"

      - name: Run the move lab
        run: python scripts/move_lab.py --years $LAB_YEARS

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/move_lab.json docs/data/move_lab_detail.csv
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Move lab results [skip ci]"
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git merge -X ours --no-edit origin/main -m "Merge origin/main [skip ci]" && git push origin main; then
              echo "Pushed on attempt $i"; break
            fi
            [ "$i" -eq 5 ] && echo "::error::Could not push results" && exit 1
            sleep $((RANDOM % 10 + 5))
          done
