name: Props backtest (real posted lines)

# Grades every prop the model read before kickoff this season -- taken from
# the saved docs/data/latest.json history -- against the players' actual box
# scores. Manual trigger only. Re-run it after each weekend to fold in the
# newest graded props. See scripts/backtest_props_live.py.
on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season to grade"
        required: false
        default: "2026"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    env:
      CFBD_API_KEY: ${{ secrets.CFBDATA_API_KEY }}
      ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      ODDSPAPI_API_KEY: ${{ secrets.PRIZEPICKS_API }}
      YEARS: "2022 2023 2024 2025"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history -- the saved prop reads live in past commits

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore cached historical CFBD data
        uses: actions/cache@v4
        with:
          path: data/raw
          key: cfbd-raw-${{ env.YEARS }}-${{ github.run_id }}
          restore-keys: |
            cfbd-raw-${{ env.YEARS }}-
            cfbd-raw-

      - name: Fetch historical data
        run: python scripts/fetch_historical_data.py --years ${{ env.YEARS }}

      - name: Build features
        run: python scripts/build_features.py --years ${{ env.YEARS }}

      - name: Train props models (for today's uncertainty math)
        run: python scripts/train_props_model.py

      - name: Grade every saved pre-kickoff prop read
        run: python scripts/backtest_props_live.py --season ${{ github.event.inputs.season || '2026' }}

      - name: Search for a props edge (line shopping, timing, minimum edge, pockets)
        run: python scripts/props_edge_finder.py --season ${{ github.event.inputs.season || '2026' }}

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/props_backtest.json docs/data/props_backtest_detail.csv docs/data/props_edge_finder.json docs/data/props_edge_finder_detail.csv
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Props backtest results [skip ci]"
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git merge -X ours --no-edit origin/main -m "Merge origin/main [skip ci]" && git push origin main; then
              echo "Pushed on attempt $i"; break
            fi
            [ "$i" -eq 5 ] && echo "::error::Could not push results" && exit 1
            sleep $((RANDOM % 10 + 5))
          done
