name: Manual CFB model run

# Runs on manual trigger (Actions tab) OR automatically once a day at
# 12:00 UTC (~8am ET -- shifts to ~7am ET during EST since GitHub Actions
# cron is always UTC and doesn't follow daylight saving). Once-daily was
# chosen specifically to stay well under the free-tier CFBD/Odds API
# quotas (see the cache step below) while still keeping lines from going
# stale between manual runs.
on:
  workflow_dispatch:
    inputs:
      years:
        description: "Season(s) to fetch/train on, space-separated"
        required: false
        default: "2022 2023 2024 2025"
      retrain:
        description: "Retrain every model from scratch (slow). Leave unticked for a normal run."
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      CFBD_API_KEY: ${{ secrets.CFBDATA_API_KEY }}
      ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      ODDSPAPI_API_KEY: ${{ secrets.PRIZEPICKS_API }}
      # PFF Pro key (routes run + targets for the receiving props models),
      # under whichever of these two names it was saved. If it is missing or
      # PFF is down, those models fall back to box-score inputs.
      PFF_API_KEY: ${{ secrets.PFF_API_KEY || secrets.CFB_API_KEY }}
      # schedule-triggered runs have no github.event.inputs at all (that
      # only exists for workflow_dispatch), so every step below that used
      # to read github.event.inputs.years directly now reads env.YEARS,
      # which falls back to the same default manual runs already use.
      # Must match what manual runs use. The daily scheduled run gets no
      # inputs, so it always used this fallback -- when it was just '2024',
      # the model had no prior-season ratings to fit and every scheduled run
      # published an empty board (found 9/2026).
      YEARS: ${{ github.event.inputs.years || '2022 2023 2024 2025' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 2022-2025 (or whatever --years covers) are completed seasons that
      # never change once fetched. Without this, every single manual run
      # re-pulls all of them from scratch (~20+ CFBD calls per year) against
      # CFBD's free-tier budget of 1,000 calls/month -- confirmed for real:
      # a run hit "429 Too Many Requests" mid-fetch after two earlier runs
      # had already burned through most of the month's quota re-fetching the
      # same historical seasons. Restoring data/raw/ here lets
      # fetch_historical_data.py's own already-cached check (see that file)
      # skip any year it already has on disk, so quota only gets spent on
      # years that are actually new. restore-keys falls back to the most
      # recent cache available even if this run's --years differs from the
      # last one, and the unique run_id in the primary key means this run's
      # progress (even if it fails partway through, e.g. from hitting quota
      # again) still gets saved for the next run to build on.
      - name: Restore cached historical CFBD data
        uses: actions/cache@v4
        with:
          path: data/raw
          key: cfbd-raw-${{ env.YEARS }}-${{ github.run_id }}
          restore-keys: |
            cfbd-raw-${{ env.YEARS }}-
            cfbd-raw-

      - name: Fetch historical data
        run: python scripts/fetch_historical_data.py --years ${{ env.YEARS }}

      # ---- Reuse trained models between runs (10/2026) ----
      # Every model here trains only on finished seasons (env.YEARS) with a
      # fixed random seed, so training produces the same models every run.
      # Building features, training and backtesting was most of the run time
      # (the props step alone also re-pulls four seasons of PFF data), so the
      # trained models and the feature tables are saved after a training run
      # and restored on later runs. A run trains again only when:
      #   - there are no saved models for this exact version of the model
      #     code, seasons and library versions (so uploading a change to
      #     anything under src/, config.py, requirements.txt or one of the
      #     training scripts retrains on its own),
      #   - the "retrain" box is ticked on a manual run, or
      #   - it is the scheduled run on a Monday (a weekly from-scratch run,
      #     so a saved copy can never go stale for more than a week).
      # What is saved: models/ and data/processed/. Neither holds raw PFF
      # numbers (PFF data is pulled into a temp folder and never written
      # here), and both are already published in this run's artifact.
      - name: Work out which saved models match this code
        id: trainkey
        run: |
          CODE=$(git ls-files -s -- 'src/*.py' config.py requirements.txt \
                   scripts/fetch_historical_data.py scripts/build_features.py \
                   scripts/train_game_model.py scripts/run_backtest.py \
                   scripts/train_props_model.py | sha256sum | cut -c1-16)
          LIBS=$(pip freeze | grep -iE '^(scikit-learn|numpy|pandas|scipy|joblib)==' | sort | sha256sum | cut -c1-12)
          SEASONS=$(echo "${{ env.YEARS }}" | tr -s ' ' '-')
          echo "prefix=trained-v1-${SEASONS}-${CODE}-${LIBS}-" >> "$GITHUB_OUTPUT"
          echo "Saved-models key: trained-v1-${SEASONS}-${CODE}-${LIBS}-"

      - name: Restore saved trained models
        id: trained
        uses: actions/cache/restore@v4
        with:
          path: |
            models
            data/processed
          key: ${{ steps.trainkey.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ steps.trainkey.outputs.prefix }}

      - name: Decide whether to train this run
        id: plan
        env:
          RETRAIN: ${{ github.event.inputs.retrain }}
          RESTORED: ${{ steps.trained.outputs.cache-matched-key }}
          EVENT: ${{ github.event_name }}
        run: |
          train=false
          why="reusing saved models"
          if [ -z "$RESTORED" ]; then
            train=true; why="no saved models for this version of the model code"
          fi
          if [ -n "$RESTORED" ]; then
            for f in models/game_model.joblib models/props/receptions.joblib models/props/rec_yds.joblib \
                     data/processed/team_game_features.csv data/processed/player_game_features.csv; do
              if [ ! -s "$f" ]; then train=true; why="saved models are incomplete (missing $f)"; fi
            done
          fi
          if [ "$EVENT" = "schedule" ] && [ "$(date -u +%u)" = "1" ]; then
            train=true; why="weekly from-scratch run (scheduled run on a Monday)"
          fi
          if [ "$RETRAIN" = "true" ]; then
            train=true; why="the retrain box was ticked"
          fi
          echo "train=$train" >> "$GITHUB_OUTPUT"
          if [ "$train" = "true" ]; then
            echo "Models: TRAINING this run -- $why"
            echo "**Models: trained this run** -- $why" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Models: $why ($RESTORED)"
            echo "**Models: reused saved models** (training steps skipped)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build features
        if: steps.plan.outputs.train == 'true'
        run: python scripts/build_features.py --years ${{ env.YEARS }}

      - name: Train game model
        if: steps.plan.outputs.train == 'true'
        run: python scripts/train_game_model.py

      - name: Backtest game model against real closing lines
        if: steps.plan.outputs.train == 'true'
        # Diagnostic only — prints real ATS win rate / moneyline calibration
        # to this log. continue-on-error since a too-short --years range can
        # legitimately have too few scoreable games (should never block the
        # dashboard export/commit below over a backtest reporting issue).
        continue-on-error: true
        run: python scripts/run_backtest.py

      - name: Train props models
        if: steps.plan.outputs.train == 'true'
        shell: bash
        # The log is also kept in the runner's temp folder (never uploaded)
        # so the next step can tell whether the PFF versions were trained.
        run: |
          set -o pipefail
          python -u scripts/train_props_model.py 2>&1 | tee "$RUNNER_TEMP/train_props.log"

      - name: Check the trained models are worth saving
        id: keep
        if: steps.plan.outputs.train == 'true'
        # If the PFF key is set but PFF could not be reached, the receiving
        # models were trained on box-score inputs only. This run still uses
        # them (same as before), but they are not saved, so the next run
        # trains again and picks PFF back up.
        run: |
          save=true
          trained_pff=$(grep -c 'PFF version |' "$RUNNER_TEMP/train_props.log" || true)
          if [ -n "${PFF_API_KEY:-}" ] && [ "${trained_pff:-0}" -lt 2 ]; then
            save=false
            echo "PFF versions trained: ${trained_pff:-0} of 2 -- not saving these models; the next run will train again."
            echo "**Models not saved** -- PFF could not be reached while training, so the next run trains again." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "save=$save" >> "$GITHUB_OUTPUT"
          echo "Save trained models: $save"

      - name: Save trained models for later runs
        if: steps.plan.outputs.train == 'true' && steps.keep.outputs.save == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            models
            data/processed
          key: ${{ steps.trained.outputs.cache-primary-key }}

      - name: Fetch current lines
        run: python scripts/fetch_current_lines.py

      - name: Export dashboard data
        run: |
          LATEST_YEAR=$(echo "${{ env.YEARS }}" | tr ' ' '\n' | sort -n | tail -1)
          python scripts/export_dashboard_data.py --year "$LATEST_YEAR"

      - name: Compute CLV (closing-line value) for flagged spread picks
        # Diagnostic only, same as the backtest step — grades any previously
        # snapshotted picks (data/clv/line_snapshots.csv, appended to by the
        # export step above on every run) against real CFBD closing lines
        # for games that have since been played. continue-on-error since an
        # empty/missing snapshot log (normal before the model's first flagged
        # pick) or a CFBD hiccup should never block the dashboard commit
        # below. See src/analysis/clv.py and scripts/compute_clv.py.
        continue-on-error: true
        run: python scripts/compute_clv.py

      - name: Track line movement on flagged props
        # Diagnostic only (10/2026). Logs each flagged prop at the price it
        # was flagged at and follows that price until kickoff, so we can see
        # how often the market moves toward the model's side. Reads the
        # export above; keeps its log in data/clv/prop_flags.csv and writes
        # docs/data/props_clv.json. continue-on-error so it can never block
        # the dashboard commit below.
        continue-on-error: true
        run: python scripts/compute_props_clv.py

      - name: Build dashboard HTML
        run: python scripts/build_dashboard.py

      - name: Commit dashboard back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/latest.json docs/dashboard.html docs/data/backtest_results.json docs/data/model_diagnostics.json docs/data/clv_results.json
          # data/clv/line_snapshots.csv doesn't exist until the model's first flagged spread
          # play ever gets snapshotted (see src/analysis/clv.py's append_line_snapshots) --
          # `git add` on a not-yet-existing path fails the whole step, so guard it rather
          # than assuming the file is already there this early in the season.
          [ -f data/clv/line_snapshots.csv ] && git add data/clv/line_snapshots.csv
          [ -f docs/data/props_clv.json ] && git add docs/data/props_clv.json
          [ -f data/clv/prop_flags.csv ] && git add data/clv/prop_flags.csv
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Update dashboard data + HTML [skip ci]"

          # The full pipeline above (historical fetch, feature build, model
          # train, live odds fetch, export, build) can run long enough for
          # something else to land on main before this step -- a patch
          # pasted by hand into the GitHub UI, or the daily 12:00 UTC
          # schedule firing while a manual run is still in flight. A plain
          # `git push` fails outright the moment that happens ("fetch
          # first" / non-fast-forward) and silently throws away this run's
          # entire output. Instead: fetch + merge whatever's new on main,
          # preferring THIS run's freshly-generated files on any conflict
          # (-X ours) -- they're the most current data by construction,
          # there's never a reason to keep a stale generated file over what
          # this run just produced. Unrelated files changed on main (e.g. a
          # hand-pasted script update that this run's commit never touched)
          # merge in cleanly with no conflict at all and are unaffected.
          # Retries a few times in case main keeps moving underneath it.
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git merge -X ours --no-edit origin/main -m "Merge remote-tracking branch origin/main [skip ci]" \
                && git push origin main; then
              echo "Pushed on attempt $i"
              break
            fi
            if [ "$i" -eq 5 ]; then
              echo "::error::Could not push after 5 attempts -- main kept moving faster than this run could catch up. Re-run the workflow once things settle."
              exit 1
            fi
            echo "Push attempt $i failed, retrying..."
            sleep $((RANDOM % 10 + 5))
          done

      - name: Upload results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cfb-model-output
          path: |
            data/processed/
            data/current/
            models/
            docs/data/
