name: Manual CFB model run

# Manual trigger only (no auto-schedule) so it doesn't burn API quota or
# retrain unexpectedly. Run it from the Actions tab when you want fresh data.
on:
  workflow_dispatch:
    inputs:
      years:
        description: "Season(s) to fetch/train on, space-separated"
        required: false
        default: "2024"

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      CFBD_API_KEY: ${{ secrets.CFBDATA_API_KEY }}
      ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      ODDSPAPI_API_KEY: ${{ secrets.PRIZEPICKS_API }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch historical data
        run: python scripts/fetch_historical_data.py --years ${{ github.event.inputs.years }}

      - name: Build features
        run: python scripts/build_features.py --years ${{ github.event.inputs.years }}

      - name: Train game model
        run: python scripts/train_game_model.py

      - name: Train props models
        run: python scripts/train_props_model.py

      - name: Fetch current lines
        run: python scripts/fetch_current_lines.py

      - name: Upload results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cfb-model-output
          path: |
            data/processed/
            data/current/
            models/
