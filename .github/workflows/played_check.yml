name: Played check (PFF snaps for ungraded props)

# One-off. For props the tracker left ungraded (no box-score line), checks
# PFF offensive snaps to tell "didn't play" (void) from "played, 0 stat".
# Writes only yes/no/unknown to docs/data/played_check.csv -- no PFF numbers.
# Does not change the tracker.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/played_check.yml"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PFF_API_KEY: ${{ secrets.PFF_API_KEY || secrets.CFB_API_KEY }}
      CFBD_API_KEY: ${{ secrets.CFBDATA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check
        run: python scripts/played_check.py --since 2026-10-07
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/played_check.csv 2>/dev/null || true
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Played check results [skip ci]"
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git merge -X ours --no-edit origin/main -m "Merge origin/main [skip ci]" && git push origin main; then break; fi
            sleep $((RANDOM % 10 + 5))
          done
